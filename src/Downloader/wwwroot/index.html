<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Downloader</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232563eb' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M12 3v12m0 0-5-5m5 5 5-5M5 21h14'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="app.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <h1>Downloader</h1>

    <form id="form" autocomplete="off">
      <input id="url" name="url" type="url" inputmode="url" placeholder="URL einfügen" required autofocus>
      <button type="submit" id="probe">Einlesen</button>
    </form>
    <p id="message" class="message" role="alert" hidden></p>

    <section id="media" class="media" hidden>
      <div class="source">
        <img id="thumbnail" alt="" referrerpolicy="no-referrer" hidden>
        <div class="about">
          <p id="media-title" class="media-title"></p>
          <p id="media-meta" class="meta"></p>
        </div>
      </div>

      <div id="video" class="pick">
        <select id="video-resolution" aria-label="Auflösung"></select>
        <select id="video-format" aria-label="Videoformat">
          <option value="original" selected>Originalformat</option>
          <option value="mp4">MP4 · läuft überall</option>
          <option value="mkv">MKV</option>
        </select>
        <button type="button" data-mode="video">Video laden</button>
      </div>

      <div id="audio" class="pick">
        <select id="audio-format" aria-label="Audioformat"></select>
        <button type="button" data-mode="audio">Audio laden</button>
      </div>

      <p class="formats">Voreingestellt ist jeweils die beste Qualität. Umgewandelte Formate klingen nie besser als das Original.</p>
    </section>

    <ul id="jobs" class="jobs"></ul>
    <p id="empty" class="hint">
      Noch nichts heruntergeladen. Downloads sind nur in diesem Browser sichtbar und werden eine Stunde nach Fertigstellung gelöscht.
    </p>
  </main>

  <template id="job">
    <li class="job">
      <div class="line">
        <span class="mode"></span>
        <span class="title"></span>
      </div>
      <div class="bar"><span></span></div>
      <div class="line">
        <span class="status"></span>
        <a class="download" download>Herunterladen</a>
        <button type="button" class="remove"></button>
      </div>
    </li>
  </template>
</body>
</html>
