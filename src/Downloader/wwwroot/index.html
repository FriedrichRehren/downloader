<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Downloader</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232563eb' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M12 3v12m0 0-5-5m5 5 5-5M5 21h14'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="app.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <h1>Downloader</h1>

    <form id="form" autocomplete="off">
      <input id="url" name="url" type="url" inputmode="url" placeholder="URL einfügen" required autofocus>
      <div class="modes">
        <button type="submit" value="video" title="Beste Qualität, so wie die Quelle sie liefert">Video</button>
        <button type="submit" value="video" data-format="mp4" class="secondary" title="H.264 in MP4, läuft in jedem Player; bei YouTube höchstens 1080p">MP4</button>
        <button type="submit" value="audio" title="Originalspur in bester Qualität">Audio</button>
        <button type="submit" value="audio" data-format="mp3" class="secondary" title="In MP3 umgewandelt, läuft in jedem Player">MP3</button>
      </div>
    </form>
    <p class="formats">Video und Audio in bester Qualität, MP4 und MP3 für jeden Player.</p>
    <p id="message" class="message" role="alert" hidden></p>

    <ul id="jobs" class="jobs"></ul>
    <p id="empty" class="hint">
      Noch nichts heruntergeladen. Downloads sind nur in diesem Browser sichtbar und werden eine Stunde nach Fertigstellung gelöscht.
    </p>
  </main>

  <template id="job">
    <li class="job">
      <div class="line">
        <span class="mode"></span>
        <span class="title"></span>
      </div>
      <div class="bar"><span></span></div>
      <div class="line">
        <span class="status"></span>
        <a class="download" download>Herunterladen</a>
        <button type="button" class="remove"></button>
      </div>
    </li>
  </template>
</body>
</html>
